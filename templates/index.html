<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기억 회상 도우미</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #FFF8EE;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 48px;
      font-size: 18px;
    }

    /* 상단 로고 */
    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-img {
      font-size: 5rem;
      display: block;
      margin-bottom: 16px;
    }
    .logo-title {
      font-size: 2rem;
      font-weight: 700;
      color: #3B2F2F;
      margin-bottom: 8px;
    }
    .logo-sub {
      font-size: 1.2rem;
      color: #8C7B6B;
    }

    /* 사용자 목록 */
    .section-title {
      font-size: 1.2rem;
      font-weight: 500;
      color: #8C7B6B;
      margin-bottom: 14px;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .user-list {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 36px;
    }

    .user-btn {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 24px 22px;
      background: white;
      border: 2px solid #E8DDD4;
      border-radius: 18px;
      cursor: pointer;
      transition: border-color .2s, transform .15s;
      text-align: left;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .user-btn:hover, .user-btn:active {
      border-color: #D4875A;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(212,135,90,0.2);
    }

    .user-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #F0A070, #D4875A);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 700; color: white;
      flex-shrink: 0;
    }
    .user-info { flex: 1; }
    .user-name {
      font-size: 1.45rem;
      font-weight: 700;
      color: #3B2F2F;
    }
    .user-age {
      font-size: 1.15rem;
      color: #8C7B6B;
      margin-top: 4px;
    }
    .user-arrow {
      font-size: 1.8rem;
      color: #D4875A;
    }

    /* 구분선 */
    .divider {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .divider-line { flex: 1; height: 1px; background: #E8DDD4; }
    .divider-text { font-size: 0.9rem; color: #B0A090; white-space: nowrap; }

    /* 새 사용자 등록 */
    .new-user-box {
      width: 100%;
      max-width: 480px;
      background: white;
      border: 2px solid #E8DDD4;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .new-user-box .box-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #3B2F2F;
      margin-bottom: 18px;
    }

    .field-label {
      font-size: 1.15rem;
      color: #5C4A3A;
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
    }
    .field {
      width: 100%;
      padding: 20px 20px;
      font-size: 1.2rem;
      font-family: 'Noto Sans KR', sans-serif;
      border: 2px solid #E8DDD4;
      border-radius: 14px;
      outline: none;
      color: #3B2F2F;
      background: #FDFAF7;
      margin-bottom: 16px;
      transition: border-color .2s;
    }
    .field:focus { border-color: #D4875A; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { margin-bottom: 0; }
    .field-sm { flex: 0 0 110px; }

    .btn-register {
      width: 100%;
      padding: 22px;
      font-size: 1.3rem;
      font-weight: 700;
      font-family: 'Noto Sans KR', sans-serif;
      background: #D4875A;
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      margin-top: 18px;
      transition: background .2s, transform .15s;
      letter-spacing: 0.3px;
    }
    .btn-register:hover { background: #BE7048; transform: translateY(-1px); }

    .empty-msg {
      text-align: center;
      color: #B0A090;
      font-size: 1rem;
      padding: 12px 0;
    }

    .btn-admin-toggle {
      width: 100%;
      padding: 14px;
      background: none;
      border: 1.5px dashed #C0B0A0;
      border-radius: 12px;
      color: #B0A090;
      font-size: 0.95rem;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
    }
    .btn-admin-toggle:hover { border-color: #8C7B6B; color: #8C7B6B; }
  </style>
</head>
<body>

  <div class="logo-area">
    <span class="logo-img">🌸</span>
    <div class="logo-title">기억 회상 도우미</div>
    <div class="logo-sub">소중한 추억을 함께 떠올려요</div>
  </div>

  <p class="section-title" id="sectionTitle" style="display:none">저는 누구일까요?</p>

  <div class="user-list" id="userList">
    <p class="empty-msg">불러오는 중...</p>
  </div>

  <!-- 보호자용 등록 (접기/펼치기) -->
  <div style="width:100%;max-width:480px;margin-top:8px;">
    <button class="btn-admin-toggle" onclick="toggleAdmin()">⚙️ 보호자 설정 (새 어르신 등록)</button>
    <div class="new-user-box" id="adminBox" style="display:none;margin-top:10px;">
      <div class="box-title">새로 등록하기</div>
      <label class="field-label">이름</label>
      <input class="field" type="text" id="newName" placeholder="예: 김영자" maxlength="20">
      <label class="field-label">나이</label>
      <input class="field" type="number" id="newAge" placeholder="예: 75" min="1" max="120" style="margin-bottom:0">
      <button class="btn-register" onclick="createUser()">등록하고 시작하기 →</button>
    </div>
  </div>

<script>
  async function loadUsers() {
    const res   = await fetch('/api/users');
    const users = await res.json();
    const list  = document.getElementById('userList');

    if (!users.length) {
      list.innerHTML = '<p class="empty-msg">등록된 분이 없습니다</p>';
      document.getElementById('sectionTitle').style.display = 'none';
      return;
    }

    // 사용자 1명이면 바로 입장
    if (users.length === 1) {
      selectUser(users[0].id, users[0].name);
      return;
    }

    // 여러 명이면 선택 화면
    document.getElementById('sectionTitle').style.display = 'block';
    list.innerHTML = users.map(u => `
      <button class="user-btn" onclick="selectUser(${u.id}, '${u.name}')">
        <div class="user-avatar">${u.name[0]}</div>
        <div class="user-info">
          <div class="user-name">${u.name}</div>
          <div class="user-age">${u.age ? u.age + '세' : ''}</div>
        </div>
        <span class="user-arrow">›</span>
      </button>`).join('');
  }

  async function selectUser(id, name) {
    await fetch('/api/session', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: id})
    });
    location.href = `/chat?user_id=${id}&name=${encodeURIComponent(name)}`;
  }

  async function createUser() {
    const name = document.getElementById('newName').value.trim();
    const age  = parseInt(document.getElementById('newAge').value);
    if (!name) { alert('이름을 입력해 주세요.'); return; }
    const res  = await fetch('/api/users', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, age: age || null})
    });
    const user = await res.json();
    selectUser(user.id, user.name);
  }

  function toggleAdmin() {
    const box = document.getElementById('adminBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }

  loadUsers();
</script>
</body>
</html>
